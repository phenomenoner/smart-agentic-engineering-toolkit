[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-agentic-engineering-toolkit"
version = "0.4.0"
description = "Validation and standalone installation helpers for the Smart Agentic Engineering Toolkit"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "phenomenoner" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "skills/*/scripts",
  "skills/*/tests",
]

[tool.setuptools]
packages = ["scripts"]
