interface:
  display_name: "Engineering Debugging"
  short_description: "Diagnose failures and audit explicit or implicit state machines"
  default_prompt: "Use $engineering-debugging for this request. For @state-audit or a requested explicit and implicit state-machine investigation, read references/state-machine-audit.md, assess functional behavior, correctness, performance and diagnosability, and carry through any authorized optimization. For a reported failure, reproduce, reduce and falsify hypotheses. Preserve the requested diagnosis-only or repair boundary and the affected effect scope."

policy:
  allow_implicit_invocation: true
