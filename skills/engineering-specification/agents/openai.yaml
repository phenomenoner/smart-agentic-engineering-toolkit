interface:
  display_name: "Engineering Specification"
  short_description: "Specify behavior and acceptance before implementation"
  default_prompt: "Use $engineering-specification to frame unresolved behavior, classify material findings against the authorized deliverable and affected effect boundary by consequence × estimated frequency, test a novel mechanism's constructibility and simpler direct/platform alternatives, then freeze only the falsifiable acceptance the claim needs."
policy:
  allow_implicit_invocation: true
